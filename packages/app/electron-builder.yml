appId: ai.slojka.app
productName: Slojka
executableName: slojka
copyright: © 2026

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asarUnpack:
  - '**/node_modules/node-pty/**'

extraResources:
  # Python-sidecar едет исходниками: venv собирается на машине пользователя.
  - from: ../../sidecar
    to: sidecar
    filter:
      - '**/*.py'
      - 'requirements-*.txt'
  # MCP-сервер — один заранее забандленный файл.
  - from: ../mcp-server/dist/index.cjs
    to: mcp-server/index.cjs
  # Данные «Удалить фон» (модель ISNet + wasm), см. tools/prepare-imgly-data.mjs.
  - from: build/imgly
    to: imgly

linux:
  target:
    - AppImage
  category: Graphics
  icon: build/icon.png
  synopsis: AI-first графический редактор
  desktop:
    entry:
      Name: Слойка
      Comment: AI-first графический редактор

# Сборка: npm run dist -- --win (на Windows-машине или через wine).
# icon.ico не обязателен: без него electron-builder возьмёт иконку по умолчанию.
win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Слойка
  # Тихая доустановка VC++ Redistributable и Python 3.11 при их отсутствии
  # (установщики скачивает tools/fetch-win-prereqs.mjs в build/win-prereqs).
  include: build/installer.nsh

npmRebuild: true
